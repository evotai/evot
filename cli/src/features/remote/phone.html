<!doctype html>
<html lang="en" class="remote-shell"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chat · evot remote</title><link rel="stylesheet" href="/chat.css"><script src="/theme.js"></script>
</head><body class="remote-page">
<main class="conversation" id="conversation">
  <header class="conversation-head">
    <button id="openSessions" class="icon-button" type="button" aria-label="Open sessions" aria-haspopup="dialog" aria-controls="sessionsDrawer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <div class="identity"><h1 id="threadTitle" class="conversation-title">evot remote</h1></div>
    <button class="icon-button" type="button" id="openChanges" aria-label="Changes" title="Changes" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h6m-3-3v6m-3 4h7"/></svg></button>
    <button id="completionSound" class="icon-button" type="button" aria-label="Round-end sound" title="Round-end sound" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
    <button id="newSession" class="icon-button" type="button" aria-label="New session" title="New session" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7M11 13l1-4 7-7 3 3-7 7z"/></svg></button>
  </header>
  <section id="pair-screen"><form id="pair" class="pair-card">
    <svg class="device-link" viewBox="0 0 136 52" aria-hidden="true"><g><rect x="4" y="6" width="25" height="40" rx="6"/><path d="M14 40h5"/></g><path class="link-trace" d="M38 26h37"/><g><rect x="84" y="7" width="47" height="32" rx="5"/><path d="M107 39v6m-10 0h20"/></g></svg>
    <output id="deviceStatus" aria-live="polite">Connecting…</output><noscript><p>Enable JavaScript to connect.</p></noscript>
    <code id="approvalCode" hidden></code><small id="approvalClock" hidden></small>
    <details class="approval-scope"><summary>Access scope</summary>This browser can access current and future sessions in this profile.</details>
    <button class="primary" type="submit" disabled>Connect</button>
  </form></section>
  <section id="pickSession" hidden><svg class="session-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="5"/><path d="M11 5v22m5-15h7m-7 5h4"/></svg><button class="primary" id="browseSessions" type="button">Choose session</button></section>
  <div class="chat-scroll" id="chat" role="region" aria-label="Conversation" tabindex="0" hidden>
    <div class="chat-loading" id="chatLoading" role="status" hidden><span>Loading messages…</span><i aria-hidden="true"></i><i aria-hidden="true"></i></div>
    <div class="welcome" id="welcome"><svg class="session-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="5"/><path d="m9 12 4 4-4 4m7 0h6"/></svg>
      <div class="suggestions"><button type="button" data-prompt="Explain this codebase and its architecture">Explain codebase</button><button type="button" data-prompt="Run the relevant tests and summarize the result">Run tests</button></div>
    </div><div id="history" aria-label="Recent conversation"></div><div id="outbox" aria-live="polite"></div>
  </div>
  <div class="composer-seat" id="seat" hidden>
    <button id="jump" type="button" aria-label="Back to latest" hidden>↓ Latest</button>
    <div class="run-line"><span class="run-state"><evot-activity id="activity" aria-hidden="true">·</evot-activity><span id="status" role="status">Connecting…</span><span id="statusDetail"></span><span id="nextModel"></span></span><button type="button" id="bgStatus" aria-controls="bgPanel" aria-haspopup="dialog" hidden></button><button id="resumeConnection" type="button" hidden>Sign in</button><span class="run-place" id="place" hidden><span id="placeName"></span><span id="placeBranch"></span></span><span id="queueSummary" role="status" hidden></span><span class="task-keys" role="group" aria-label="Composer shortcuts"><button type="button" id="tabKey" aria-keyshortcuts="Tab" hidden>Tab <span></span></button><button type="button" id="escapeKey" aria-keyshortcuts="Escape" hidden>Esc</button></span></div>
    <section id="questions" class="question-card" aria-label="Question from evot" hidden></section>
    <div class="composer-stack" id="composerStack" hidden>
    <div class="composer-fold"><div class="composer-content" id="composerContent">
    <div id="promptQueue" aria-label="Pending messages" role="status" hidden></div>
    <section class="composer-card" id="compose" aria-label="Message composer"><div class="command-menu" id="commandMenu" role="group" aria-label="Command suggestions" hidden></div><div class="attachments" id="attachments" hidden></div><div class="draft-surface"><textarea id="draft" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" writingsuggestions="false" rows="1" maxlength="8192" aria-label="Message" aria-controls="commandMenu" aria-describedby="draftHint draftCommandHint"></textarea><span id="draftHint" role="status" hidden></span><div id="draftGhost" hidden><span id="draftGhostPrefix" aria-hidden="true"></span><wbr><span id="draftCommandHint"></span></div></div>
      <div class="composer-row"><div class="composer-tools">
        <button id="attach" class="round-tool attach-btn" type="button" aria-label="Add photos" title="Add photos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-5 4 4 2.5-2.5L20 17"/></svg></button><input id="imageInput" type="file" accept="image/*" multiple hidden>
        <div class="model-pill"><label class="seat-picker native-picker"><span class="seat-label" id="modelLabel">Model</span><select class="seat-trigger" id="models" aria-label="Model" disabled></select></label>
        <label class="seat-picker native-picker effort-picker" id="effortPicker" hidden><span class="seat-label" id="effortLabel">Thinking</span><select class="seat-trigger" id="effort" aria-label="Thinking level" disabled></select></label></div>
      </div><div class="composer-trailing"><select id="suggestionPicker" aria-label="Choose a suggestion to edit" hidden><option value="">Suggestions</option></select><button id="send" type="button" class="send-btn" aria-label="Send message" title="Send message" disabled>↑</button></div></div>
    </section>
    </div></div>
    <div class="compact-composer" id="compactComposer" inert>
      <button id="writeMessage" type="button" aria-controls="composerContent" aria-expanded="false" aria-label="Open composer" title="Open composer">Message…</button>
    </div>
    </div>
  </div>
  <div id="notice" role="status" hidden></div>
</main>
<dialog id="changesPage" aria-label="Working tree changes"></dialog>
<dialog id="photoPreview" aria-label="Photo preview"><img alt=""><button class="icon-button" type="button" aria-label="Close photo preview" autofocus>×</button></dialog>
<dialog id="folderPanel" aria-labelledby="folderTitle"><div class="drawer-head"><h2 id="folderTitle" tabindex="-1" autofocus>New session in</h2><button id="closeFolders" class="icon-button" aria-label="Close">×</button></div><div id="folderList" role="list"></div><p id="folderMessage" role="status"></p></dialog>
<dialog id="bgPanel" aria-labelledby="bgTitle"><div class="drawer-head"><h2><evot-activity id="bgOutputActivity" aria-hidden="true" hidden></evot-activity><span id="bgTitle">Background</span></h2><button id="closeBg" class="icon-button" aria-label="Close background panel">×</button></div><p id="bgSubtitle"></p><button id="allTasks" type="button" hidden>‹ All tasks</button><div id="bgTasks"></div><pre id="bgOutput" tabindex="0" aria-label="Task output" hidden></pre></dialog>
<dialog id="sessionsDrawer" aria-labelledby="drawerTitle"><div class="drawer-body">
  <header class="drawer-head"><h2 id="drawerTitle" tabindex="-1" autofocus>Sessions</h2><div class="drawer-actions"><button id="drawerNew" class="icon-button" type="button" aria-label="New session in a folder" title="New session in a folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="closeSessions" class="icon-button" aria-label="Close sessions">×</button></div></header>
  <label class="session-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="sessionSearch" type="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" writingsuggestions="false" placeholder="Search" aria-label="Search sessions"></label>
  <div class="session-lists">
  <p id="selectionMessage" role="status" hidden></p>
  <div id="terminals" aria-label="Sessions"></div>
  <div id="archived" role="status"></div><button id="moreSessions" type="button" hidden>Load more</button><button id="askSearch" type="button" hidden></button><p id="directoryMessage" role="status"></p></div>
  <footer class="drawer-foot"><span id="drawerHost"></span><span id="transport"></span><button type="button" class="theme-toggle">Light mode</button></footer>
</div></dialog>
<!-- phone-client --></body></html>
