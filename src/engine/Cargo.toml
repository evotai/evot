[package]
name = "evotengine"
version.workspace = true
edition.workspace = true
description = "Bend Engine - autonomous agent runtime"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parking_lot = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = "0.6"
htmd = { workspace = true }
futures = "0.3"
jsonrepair = "0.1"
unicode-normalization = "0.1"
rand = "0.8"
base64 = "0.22"
flate2 = "=1.1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
command-group = { version = "5", features = ["with-tokio"] }
headless_chrome = { workspace = true }
html2text = { workspace = true }
tree-sitter = { version = "0.24" }
tree-sitter-rust = { version = "0.23" }
tree-sitter-python = { version = "0.23" }
tree-sitter-javascript = { version = "0.23" }
tree-sitter-typescript = { version = "0.23" }
tree-sitter-go = { version = "0.23" }
tree-sitter-java = { version = "0.23" }
tree-sitter-c = { version = "0.23" }
tree-sitter-cpp = { version = "0.23" }
tree-sitter-c-sharp = { version = "0.23" }
tree-sitter-ruby = { version = "0.23" }
tree-sitter-php = { version = "0.23" }
tree-sitter-swift = { version = "0.7" }
tree-sitter-kotlin-ng = { version = "1.1" }
tree-sitter-scala = { version = "0.23" }
tree-sitter-bash = { version = "0.23" }
tree-sitter-lua = { version = "0.4" }
tree-sitter-elixir = { version = "0.3" }
tree-sitter-haskell = { version = "0.23" }
similar = "2"
lru = "0.12"
ignore = "0.4"
globset = "0.4"
grep = "0.4"
rayon = { version = "1.10" }


[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wiremock = "0.6"
proptest = "1"

[lints.clippy]
module_inception = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
