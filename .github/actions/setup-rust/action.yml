name: Setup Rust
description: Install Rust toolchain and cache cargo artifacts

inputs:
  targets:
    description: Additional targets to install
    required: false
    default: ""
  sccache:
    description: Install the optional compiler cache
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        if ! command -v apt-get &> /dev/null; then
          exit 0
        fi
        missing=()
        for package in libssl-dev pkg-config; do
          if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null \
            | grep -qx 'install ok installed'; then
            missing+=("$package")
          fi
        done
        if ((${#missing[@]})); then
          apt=(apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo timeout --kill-after=15s 3m "${apt[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 3m \
            "${apt[@]}" install -y --no-install-recommends "${missing[@]}"
        fi

    - name: Init submodules
      shell: bash
      run: git submodule update --init --recursive

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup show
        if [ -n "${{ inputs.targets }}" ]; then
          rustup target add ${{ inputs.targets }}
        fi

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-

    - name: Setup sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        token: ${{ github.token }}
