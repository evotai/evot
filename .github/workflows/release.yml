name: Release

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Release date (YYYY-MM-DD); empty uses the current UTC date'
        type: string
        required: false
        default: ''
      prerelease:
        description: 'Create as beta prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: evot

jobs:
  create_release:
    name: Create tag and prerelease (draft)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      previous: ${{ steps.next.outputs.previous }}
      name: ${{ steps.next.outputs.name }}
      semver: ${{ steps.next.outputs.semver }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version (CalVer)
        id: next
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DATE="${RELEASE_DATE:-$(date -u +%F)}"
          if [[ ! "${RELEASE_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             [[ "$(date -u -d "${RELEASE_DATE}" +%F)" != "${RELEASE_DATE}" ]]; then
            echo 'Invalid release_date: expected a valid YYYY-MM-DD date' >&2
            exit 1
          fi
          YEAR="$(date -u -d "${RELEASE_DATE}" +%Y)"
          MONTH="$(date -u -d "${RELEASE_DATE}" +%-m)"
          DAY="$(date -u -d "${RELEASE_DATE}" +%-d)"
          BASE="${YEAR}.${MONTH}.${DAY}"
          PREV="$(
            gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+' \
              | sort -V \
              | tail -n 1 \
              || true
          )"
          if [ -z "${PREV}" ]; then
            PREV="$(
              git for-each-ref --sort=-version:refname --format='%(refname:strip=2)' refs/tags \
                | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+' \
                | head -n 1 \
                || true
            )"
          fi
          PREV="$(printf '%s' "${PREV}" | tr -d '\r' | xargs)"

          IS_BETA="${{ inputs.prerelease }}"

          if [ "${IS_BETA}" = "true" ]; then
            SUFFIX=1
            while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${BASE}-beta.${SUFFIX}" >/dev/null 2>&1; do
              SUFFIX=$((SUFFIX + 1))
            done
            NEXT_TAG="v${BASE}-beta.${SUFFIX}"
            NEXT_VERSION="${BASE}-beta.${SUFFIX}"
            RELEASE_NAME="evot ${BASE}-beta.${SUFFIX}"
          else
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${BASE}" >/dev/null 2>&1; then
              NEXT_TAG="v${BASE}"
              NEXT_VERSION="${BASE}"
            else
              SUFFIX=2
              while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${BASE}.${SUFFIX}" >/dev/null 2>&1; do
                SUFFIX=$((SUFFIX + 1))
              done
              NEXT_TAG="v${BASE}.${SUFFIX}"
              NEXT_VERSION="${BASE}.${SUFFIX}"
            fi
            RELEASE_NAME="evot ${NEXT_VERSION}"
          fi

          echo "previous=${PREV}" >> "${GITHUB_OUTPUT}"
          echo "tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

          # Compute semver for Cargo / binstall asset naming
          IFS='.' read -r Y M D SFX <<< "${NEXT_VERSION%-beta.*}"
          SEMVER="${Y}.$(printf '%d%02d' "${M}" "${D}").${SFX:-0}"
          case "${NEXT_VERSION}" in
            *-beta.*) SEMVER="${SEMVER}-beta.${NEXT_VERSION##*-beta.}" ;;
          esac
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture release metadata
        id: meta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Tag (annotated)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "${{ steps.next.outputs.tag }}" "${{ steps.meta.outputs.sha }}" -m "${{ steps.next.outputs.tag }}"

      - name: Push tag
        if: github.ref_name == 'main'
        shell: bash
        run: git push origin "refs/tags/${{ steps.next.outputs.tag }}"

      - name: Generate release notes
        id: notes
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          PREV="${{ steps.next.outputs.previous }}"
          SHA="${{ steps.meta.outputs.sha }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          AUTO_NOTES_FILE="${RUNNER_TEMP}/auto-release-notes.md"
          CHANGELOG_FILE="${RUNNER_TEMP}/git-changelog.md"

          API_ARGS=(
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${TAG}"
            -f "target_commitish=${SHA}"
          )
          if [ -n "${PREV}" ]; then
            API_ARGS+=(-f "previous_tag_name=${PREV}")
          fi

          gh api --method POST "${API_ARGS[@]}" --jq '.body // ""' > "${AUTO_NOTES_FILE}"

          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${SHA}"
          else
            RANGE="${SHA}"
          fi

          git log --first-parent --reverse --pretty=format:'- %s (%h)' "${RANGE}" > "${CHANGELOG_FILE}"

          cat "${AUTO_NOTES_FILE}" > "${NOTES_FILE}"
          if [ -s "${NOTES_FILE}" ]; then
            printf '\n\n' >> "${NOTES_FILE}"
          fi

          echo "### Changelog" >> "${NOTES_FILE}"
          if [ -s "${CHANGELOG_FILE}" ]; then
            cat "${CHANGELOG_FILE}" >> "${NOTES_FILE}"
            printf '\n' >> "${NOTES_FILE}"
          else
            echo "- Initial release" >> "${NOTES_FILE}"
          fi

          echo "file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create prerelease (draft)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.next.outputs.tag }}"
          NAME="${{ steps.next.outputs.name }}"

          PRERELEASE_ARG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_ARG="--prerelease"
          fi

          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "${NAME}" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            ${PRERELEASE_ARG} \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: create_release
    if: github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          ref: refs/tags/${{ needs.create_release.outputs.tag }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # Release builds do not use RUSTC_WRAPPER. Do not fail a release
          # because downloading an unused optional compiler cache times out.
          sccache: 'false'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set version in Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ needs.create_release.outputs.semver }}"
          sed -i.bak "s/^version = \".*\"/version = \"${SEMVER}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Install zig & cargo-zigbuild (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          # Link the NAPI addon with zig against glibc 2.17 so the released .node
          # runs on older distros (Ubuntu 18.04+, Debian 10+, CentOS 7, ...)
          # instead of requiring the ubuntu-latest runner's glibc (currently 2.39).
          # Note: zig 0.16+ tarballs are named zig-<arch>-linux-<ver>.tar.xz
          # (no "unknown-gnu"), and extract to a directory of the same name.
          ZIG_VERSION="0.16.0"
          case "$(uname -m)" in
            x86_64)  ZIG_PLATFORM="x86_64-linux" ;;
            aarch64) ZIG_PLATFORM="aarch64-linux" ;;
            *)       echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}" >> "${GITHUB_PATH}"
          curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-zigbuild --version 0.23.0

      - name: Build NAPI binding (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          bun install
          cargo zigbuild --manifest-path addon/Cargo.toml --release --target "${{ matrix.target }}.2.17"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  BINDING="evot-napi.linux-x64-gnu.node" ;;
            aarch64-unknown-linux-gnu) BINDING="evot-napi.linux-arm64-gnu.node" ;;
          esac
          # addon is a member of the root workspace: artifacts land in the
          # workspace-root target dir, i.e. ../target relative to cli/.
          strip --strip-unneeded "../target/${{ matrix.target }}/release/libevot_napi.so"
          cp "../target/${{ matrix.target }}/release/libevot_napi.so" "${BINDING}"
          # Guard: the released binding must not require glibc newer than 2.17.
          # Capture only [0-9.] after "Name: GLIBC_" — a greedy (.+) would eat
          # the space before "Flags" and break the string comparison below.
          MAX_GLIBC="$(LANG=C readelf -W --version-info --dyn-syms "${BINDING}" \
            | grep 'Name: GLIBC' \
            | sed -re 's/.*Name: GLIBC_([0-9.]+).*/\1/g' \
            | sort -t . -k1,1n -k2,2n -k3,3n \
            | tail -n 1)"
          [ "${MAX_GLIBC}" = "2.17" ] \
            || { echo "error: ${BINDING} requires GLIBC_${MAX_GLIBC}, expected 2.17" >&2; exit 1; }
          echo "✓ ${BINDING} requires glibc >= ${MAX_GLIBC} only"
        env:
          EVOT_VERSION: ${{ needs.create_release.outputs.version }}

      - name: Build NAPI binding (macOS)
        if: endsWith(matrix.target, '-apple-darwin')
        shell: bash
        run: |
          cd cli
          bun install
          npx napi build --manifest-path addon/Cargo.toml --release --platform --target ${{ matrix.target }} --output-dir .
        env:
          EVOT_VERSION: ${{ needs.create_release.outputs.version }}

      - name: Build CLI binary
        shell: bash
        run: |
          cd cli
          BUN_TARGET=""
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)   BUN_TARGET="--target=bun-linux-x64" ;;
            aarch64-unknown-linux-gnu)  BUN_TARGET="--target=bun-linux-arm64" ;;
            aarch64-apple-darwin)       BUN_TARGET="--target=bun-darwin-arm64" ;;
            x86_64-apple-darwin)        BUN_TARGET="--target=bun-darwin-x64" ;;
          esac
          bun build src/index.ts --compile ${BUN_TARGET} --define 'process.env.DEV="false"' --define 'process.env.NODE_ENV="production"' --outfile dist/${{ env.BINARY_NAME }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.create_release.outputs.version }}"
          mkdir -p distro/{bin,lib}
          cp cli/dist/${{ env.BINARY_NAME }} distro/bin/
          cp cli/${{ env.BINARY_NAME }}-napi.*.node distro/lib/
          if [ "$(uname -s)" = "Darwin" ]; then
            # Re-sign bun-compiled binary: remove potentially invalid signature, then adhoc sign
            codesign --remove-signature distro/bin/${{ env.BINARY_NAME }} 2>/dev/null || true
            codesign --force --sign - distro/bin/${{ env.BINARY_NAME }}
            for f in distro/lib/*.node; do
              codesign --force --sign - "$f"
            done
          fi
          tar -C distro -czf ${{ env.BINARY_NAME }}-v${VERSION}-${{ matrix.target }}.tar.gz bin lib

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.create_release.outputs.version }}"
          ARCHIVE="${{ env.BINARY_NAME }}-v${VERSION}-${{ matrix.target }}.tar.gz"
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$ARCHIVE" | awk '{print $1}' > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" | awk '{print $1}' > "${ARCHIVE}.sha256"
          fi

      - name: Upload artifact to release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create_release.outputs.tag }}"
          VERSION="${{ needs.create_release.outputs.version }}"
          ARCHIVE="${{ env.BINARY_NAME }}-v${VERSION}-${{ matrix.target }}.tar.gz"
          gh release upload "${TAG}" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize_release:
    name: Publish release (undraft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [create_release, build]
    if: success() && github.ref_name == 'main' && needs.create_release.result == 'success' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify all published packages and checksums
        shell: bash
        run: python3 .github/scripts/verify-release-assets.py "${TAG}" --repo "${GITHUB_REPOSITORY}"
        env:
          TAG: ${{ needs.create_release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create_release.outputs.tag }}"
          ARGS=(--draft=false --repo "${GITHUB_REPOSITORY}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release edit "${TAG}" "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
