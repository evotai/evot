name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: ERROR
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --no-fail-fast

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd cli && bun install
      - run: cd cli && npx napi build --manifest-path addon/Cargo.toml --release --platform --output-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: evot-napi-linux-x64-gnu
          path: cli/evot-napi.linux-x64-gnu.node
          if-no-files-found: error

  test-cli:
    name: Test CLI (TypeScript)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd cli && bun install
      - uses: actions/download-artifact@v4
        with:
          name: evot-napi-linux-x64-gnu
          path: cli
      - run: cd cli && bunx tsc --noEmit
      - run: cd cli && bun test tests/ --path-ignore-patterns 'tests/tui/**'

  test-cli-macos:
    name: Test CLI (macOS arm64)
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd cli && bun install
      - run: cd cli && bunx tsc --noEmit
      - uses: ./.github/actions/setup-rust
      - run: cd cli && bun run build:napi
      - run: cd cli && bun test tests/ --path-ignore-patterns 'tests/tui/**'
      - run: cd cli && bun run build:cli
      - run: cd cli && EVOT_TEST_NATIVE_CONTRACT=1 bun test tests/native/native-config-contract.test.ts
      - run: cd cli && bun run test:tui
